<style>

    --hot:#4A3E0E; --hot-ink:#FFE38A; --code-bg:#121916; --good:#3DC79D; --good-bg:#10302A; --bad:#F0729E; --bad-bg:#3A1826;

}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --line:#2D3A35; --line-soft:#232E2A;
  --ink:#E2EAE6; --muted:#97A7A0; --faint:#6A7A74;

*{box-sizing:border-box}

/* role chips in prose: <span class="role" data-role="id">text</span> */
.role{font-weight:600; border-radius:4px; padding:0 4px; color:var(--c); background:var(--cbg)}

.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}

.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.scroll-x{overflow-x:auto}

/* transport */
.transport{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:12px 16px; border-top:1px solid var(--line-soft)}
.tbtn{display:inline-grid; place-items:center; width:34px; height:34px; border:1px solid var(--line); border-radius:7px; background:var(--surface); cursor:pointer}
.tbtn:hover{border-color:var(--ink)}
.tbtn svg{width:16px; height:16px}
.tbtn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); width:auto; padding:0 14px; gap:6px; grid-auto-flow:column; font-size:14px; font-weight:600}
.count{font-family:var(--mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:6em}
.scrub{position:relative; flex:1 1 220px; height:36px; min-width:160px}
.scrub input{position:absolute; inset:0; width:100%; margin:0; opacity:0; cursor:pointer; z-index:2}
.scrub .track{position:absolute; left:0; right:0; top:15px; height:3px; border-radius:2px; background:var(--line)}
.scrub .fill{position:absolute; left:0; top:15px; height:3px; border-radius:2px; background:var(--ink)}
.scrub .knob{position:absolute; top:9px; width:15px; height:15px; margin-left:-7px; border-radius:50%; background:var(--ink); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--ink)}
.scrub input:focus-visible ~ .knob{box-shadow:0 0 0 3px var(--r3)}
.scrub .tick{position:absolute; top:22px; transform:translateX(-50%); font-family:var(--mono); font-size:10px; color:var(--muted); white-space:nowrap}
.scrub .tick::before{content:""; position:absolute; left:50%; top:-8px; width:2px; height:6px; background:var(--muted); margin-left:-1px}
.scrub .tick.first{transform:none} .scrub .tick.first::before{left:1px}
.scrub .tick.last{transform:translateX(-100%)} .scrub .tick.last::before{left:auto; right:0}
.speed{font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center}
.speed select{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:3px 4px}

/* side panels / narration */
.side{padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}

.side h4{font-size:20px; font-weight:600}

.side ul{margin:0; padding-left:18px; font-size:14px; color:var(--muted)}
.say{border-radius:8px; padding:12px 14px; background:var(--surface-2); font-size:15px; line-height:1.55; border-left:3px solid var(--c, var(--line))}
.say .stepn{font-family:var(--mono); font-size:11px; color:var(--muted); display:block; margin-bottom:4px}

/* screen (agent-written mini UI) and state readout */
.screen{border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:10px; font-size:13px; overflow:auto}
.screen-label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:6px}
.scr-row{display:flex; gap:8px; align-items:stretch} .scr-col{display:flex; flex-direction:column; gap:6px; min-width:0}
.scr-box{border:1px solid var(--line); border-radius:5px; padding:6px 8px; background:var(--surface)}
.scr-muted{color:var(--muted)} .scr-hot{background:var(--hot); color:var(--hot-ink)} .scr-sel{box-shadow:0 0 0 2px var(--r3)}
.scr-ghost{opacity:.4; border-style:dashed} .scr-off{opacity:.45; filter:grayscale(1)} .scr-line{height:3px; border-radius:2px; background:var(--r3)}
.scr-tag{font-family:var(--mono); font-size:10px; color:var(--faint)}
.state{display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 12px; font-family:var(--mono); font-size:12px; border:1px solid var(--line-soft); border-radius:8px; padding:8px 10px; background:var(--surface)}
.state .sk{color:var(--muted)} .state .sv{word-break:break-word; border-radius:3px; padding:0 3px}
.chg{background:var(--hot); color:var(--hot-ink)}

/* glossary */
.gloss{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:22px}
.gcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.gcard b{font-family:var(--display); font-size:18px; font-weight:600}
.gcard .code{font-family:var(--mono); font-size:12px; color:var(--muted)}
.gcard p{font-size:14.5px}
.gcard .ex{font-size:13.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:6px}

/* map */
.map-wrap{display:grid; grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:900px){ .map-wrap{grid-template-columns:1fr} .map-wrap .side{border-top:1px solid var(--line-soft)} }
@media (min-width:901px){ .map-wrap .side{border-left:1px solid var(--line-soft)} }
.map{padding:12px; min-width:0}
.map svg{display:block; width:100%; min-width:620px; height:auto; font-family:var(--sans)}
.area rect{fill:var(--surface-2); stroke:var(--line)}
.area .al{font-family:var(--mono); font-size:11px; fill:var(--muted); letter-spacing:.05em; text-transform:uppercase}
.area .ab{font-family:var(--display); font-size:21px; font-weight:600; fill:var(--ink)}
.area .as{font-size:12.5px; fill:var(--muted)}
.mode-areas .area{cursor:pointer} .mode-areas .area:hover rect{stroke:var(--ink)}
.mode-parts .area .ab,.mode-parts .area .as{display:none} .mode-areas .area .al{display:none}
.mode-areas .part,.mode-areas .link{display:none} .mode-parts .alink{display:none}
.part{cursor:pointer}
.part rect{fill:var(--surface); stroke:var(--c); stroke-width:1.5}
.part text{fill:var(--ink); font-size:13px; font-weight:600}
.part text.s{fill:var(--muted); font-size:11px; font-weight:400; font-family:var(--mono)}
.part:hover rect,.part.on rect{fill:var(--cbg); stroke-width:2.5}
.link path{fill:none; stroke:var(--faint); stroke-width:1.4}
.link polygon{fill:var(--faint)}
.link text,.alink text{font-size:11px; fill:var(--muted); paint-order:stroke; stroke:var(--surface); stroke-width:4px; stroke-linejoin:round}
.alink text{font-size:12px; fill:var(--ink)}
.alink path{fill:none; stroke:var(--muted); stroke-width:1.8} .alink polygon{fill:var(--muted)}
.link.on path{stroke:var(--c); stroke-width:2.6} .link.on polygon{fill:var(--c)} .link.on text{fill:var(--ink); font-weight:600}
.dim .part:not(.on),.dim .link:not(.on){opacity:.2}
.badge circle{fill:var(--ink)} .badge text{fill:var(--bg); font-size:11px; font-weight:700; font-family:var(--mono)}

/* flow */
.flow-wrap{display:grid; grid-template-columns:minmax(0,1fr) 380px}
@media (max-width:1000px){ .flow-wrap{grid-template-columns:1fr} .flow-wrap .side{border-top:1px solid var(--line-soft)} }
@media (min-width:1001px){ .flow-wrap .side{border-left:1px solid var(--line-soft)} }
.flow{padding:12px; min-width:0}
.flow svg{display:block; width:100%; min-width:620px; height:auto; font-family:var(--sans)}
.lane-h rect{fill:var(--cbg); stroke:var(--c)} .lane-h text{font-size:12px; font-weight:600; fill:var(--c)}
.lifeline{stroke:var(--line); stroke-dasharray:3 4}
.msg{cursor:pointer}
.msg line,.msg path{stroke:var(--faint); stroke-width:1.4; fill:none} .msg polygon{fill:var(--faint)}
.msg text{font-size:11.5px; fill:var(--muted)} .msg .num{font-family:var(--mono); font-size:10px; fill:var(--faint)}

.msg.past line,.msg.past path{stroke:var(--muted)} .msg.past polygon{fill:var(--muted)} .msg.past text{fill:var(--ink)}

.phase{font-family:var(--mono); font-size:10px; fill:var(--faint); letter-spacing:.06em} .phase-line{stroke:var(--line-soft)}

/* trace */
.trace{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:1000px){ .trace{grid-template-columns:1fr} .codepane{border-bottom:1px solid var(--line-soft)} }
@media (min-width:1001px){ .codepane{border-right:1px solid var(--line-soft)} }
.codepane{min-width:0; display:flex; flex-direction:column}
.filetabs{display:flex; flex-wrap:wrap; gap:2px; padding:8px 8px 0; border-bottom:1px solid var(--line-soft); background:var(--surface-2)}
.filetab{font-family:var(--mono); font-size:11.5px; padding:6px 10px; border-radius:6px 6px 0 0; color:var(--muted); border:1px solid transparent; border-bottom:0; margin-bottom:-1px}
.filetab.on{background:var(--code-bg); color:var(--ink); border-color:var(--line-soft)}
.code{background:var(--code-bg); font-family:var(--mono); font-size:12.5px; line-height:1.65; overflow:auto; max-height:600px; padding-block:8px}
.ln{display:grid; grid-template-columns:22px 40px minmax(0,1fr); white-space:pre}
.ln .ar{color:var(--r3); text-align:center; font-size:11px} .ln .no{color:var(--faint); text-align:right; padding-right:12px; user-select:none} .ln .cd{padding-right:12px}
.ln.cur{background:var(--hot)} .ln.cur .cd{color:var(--hot-ink)} .ln.rng{background:color-mix(in srgb, var(--hot) 45%, transparent)}
.ln.dim .cd{opacity:.45}
.tk{color:var(--r2)} .ts{color:var(--r4)} .tc{color:var(--faint); font-style:italic} .tf{color:var(--r3)}
.callout{margin:4px 12px 8px 62px; font-family:var(--sans); font-size:14.5px; line-height:1.55; white-space:normal; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--r3); border-radius:6px; padding:10px 12px; color:var(--ink)}
.ask{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line)}
.ask b{display:block; margin-bottom:8px}
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opts button{border:1px solid var(--line); background:var(--surface-2); border-radius:6px; padding:5px 10px; font-size:13px; cursor:pointer}

.stack{display:flex; flex-direction:column-reverse; gap:3px}
.frame{font-family:var(--mono); font-size:12px; padding:4px 8px; border-radius:5px; border-left:3px solid var(--c); background:var(--surface-2); color:var(--muted); display:flex; justify-content:space-between; gap:8px}

.none{color:var(--faint); font-size:13px}

<body>

  const byP = Object.fromEntries(parts.map(p => [p.id, p]));
  const zbtn = z => $(`[data-z="${z}"]`, demo);
  function setMode(m){ svg.setAttribute("class", "mode-" + m); zbtn("areas").setAttribute("aria-pressed", m==="areas"); zbtn("parts").setAttribute("aria-pressed", m==="parts"); }
  function clear(){ svg.classList.remove("dim"); svg.querySelectorAll(".on").forEach(x => x.classList.remove("on")); gB.innerHTML = ""; }
  function focus(ps, ls){ clear(); svg.classList.add("dim"); ps.forEach(id => svg.querySelector(`[data-p="${id}"]`)?.classList.add("on")); ls.forEach(id => svg.querySelector(`.link[data-l="${id}"]`)?.classList.add("on")); }
  function intro(){ clear(); side.innerHTML = `<span class="k">Start here</span>${s.start ? `<h4>${esc(s.start.title||"")}</h4>${[].concat(s.start.body||[]).map(p=>`<p>${prose(p)}</p>`).join("")}` : ""}<p style="color:var(--muted)">Click an area to see its parts. Click a part to read about it.${(s.tour||[]).length ? " Or press Next below to follow the tour." : ""}</p>`; }
  function showPart(id){
    const p = byP[id]; const ls = links.filter(l => l.from===id || l.to===id);
    setMode("parts"); focus([id, ...ls.map(l => l.from===id ? l.to : l.from)], ls.map(l => l.id));
    const talk = ls.map(l => { const other = byP[l.from===id ? l.to : l.from]; return `<li>${l.from===id ? "To" : "From"} <b>${esc(other?.name)}</b>${l.label ? `: ${esc(l.label)}` : ""}</li>`; }).join("");
    side.innerHTML = `<span class="k" style="color:${rc(p.role)}">${esc(A[p.area]?.name||"")}</span><h4>${esc(p.name)}</h4><p>${prose(p.about)}</p>${talk ? `<div><span class="k">Connections</span><ul>${talk}</ul></div>` : ""}${p.code || p.file ? `<span class="path">${p.code ? `Name in the code: ${esc(p.code)}<br>` : ""}${p.file ? `File: ${esc(p.file)}` : ""}</span>` : ""}`;
  }
  function showArea(id){
    setMode("parts");
    const ids = partsIn(id).map(p => p.id);
    const ls = links.filter(l => ids.includes(l.from) || ids.includes(l.to));
    focus([...ids, ...ls.flatMap(l => [l.from, l.to])], ls.map(l => l.id));
    side.innerHTML = `<span class="k">Area</span><h4>${esc(A[id].name)}</h4>${A[id].about ? `<p>${prose(A[id].about)}</p>` : ""}<p style="color:var(--muted)">Click a part to read about it. Faded parts belong to other areas.</p>`;
  }
  let tour = null;
  svg.addEventListener("click", e => {
    const p = e.target.closest(".part"); if (p) { tour?.stop(); return showPart(p.dataset.p); }
    const a = e.target.closest(".area"); if (a) { tour?.stop(); return showArea(a.dataset.a); }
  });
  svg.addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && e.target.closest(".part,.area")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles:true })); } });
  zbtn("areas").onclick = () => { setMode("areas"); intro(); };
  zbtn("parts").onclick = () => { setMode("parts"); intro(); };
  if ((s.tour||[]).length) {
    const T = s.tour;
    const ticks = {}; T.forEach((t,k) => { if (t.tick) ticks[k] = t.tick; });
    tour = makePlayer($(".tr", demo), { count:T.length, ticks, key, render: k => {
      const t = T[k];
      if (!(t.parts||[]).length && !(t.links||[]).length) { setMode("areas"); clear(); }
      else {
        setMode("parts"); focus(t.parts||[], t.links||[]);
        (t.links||[]).forEach(id => { const path = svg.querySelector(`.link[data-l="${id}"] path`); if (!path) return;
          const m = path.getPointAtLength(path.getTotalLength()*0.5);
          const g = el("g", { class:"badge" }, gB); el("circle", { cx:m.x, cy:m.y+6, r:10 }, g); el("text", { x:m.x, y:m.y+10, "text-anchor":"middle" }, g, k+1); });
      }
      side.innerHTML = `<span class="k">Tour · step ${k+1} of ${T.length}</span><p>${prose(t.say)}</p>`;
    } });
  }
  setMode("areas"); intro();
}

/* ═════ flow: lanes, messages in time order, live screen and state ═════ */
function renderFlow(s, i){
  const sec = sectionHead(s, i, "Zoom 2 · one action, step by step");
  const key = secId(s, i);
  const demo = el("div", { class:"demo" }, sec);
  demo.innerHTML = `<div class="flow-wrap"><div class="flow scroll-x"></div><div class="side"><div class="say"></div><div class="scr"></div><div class="st"></div></div></div><div class="tr"></div>`;
  const lanes = s.lanes || [], M = s.steps || [];
  const L = Object.fromEntries(lanes.map(l => [l.id, l]));
  const laneW = Math.max(108, ...lanes.map(l => l.name.length*7.6 + 26));
  const X = {}; lanes.forEach((l,k) => X[l.id] = 40 + laneW/2 + k*laneW);
  const loopRight = Math.max(0, ...M.filter(m => m.from === m.to && X[m.from] != null).map(m => X[m.from] + 32 + String(m.label).length*6.4 + 12));
  const top = 64, row = 42, W = Math.max(40 + laneW*lanes.length + 30, loopRight), H = top + M.length*row + 16;
  const svg = el("svg", { viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label": s.alt || s.title || "Sequence of messages" }, $(".flow", demo));
  lanes.forEach(l => {
    const x = X[l.id];
    el("line", { class:"lifeline", x1:x, y1:44, x2:x, y2:H-6 }, svg);
    const g = el("g", { class:"lane-h", style: roleStyle(l.role) }, svg);
    const w = Math.min(laneW - 8, l.name.length*7.6 + 20);
    el("rect", { x:x-w/2, y:12, width:w, height:28, rx:6 }, g);
    el("text", { x, y:31, "text-anchor":"middle" }, g, l.name);
  });
  const gs = M.map((m, k) => {
    const yy = top + k*row + 20, role = L[m.from]?.role;
    if (m.phase) { el("line", { class:"phase-line", x1:0, y1:yy-21, x2:W, y2:yy-21 }, svg); el("text", { class:"phase", x:W-8, y:yy-9, "text-anchor":"end" }, svg, String(m.phase).toUpperCase()); }
    const g = el("g", { class:"msg", style: roleStyle(role) }, svg);
    el("rect", { class:"band", x:0, y:yy-20, width:W, height:row-2, rx:4 }, g);
    const x1 = X[m.from], x2 = X[m.to];
    if (m.from === m.to) {
      el("path", { d:`M${x1} ${yy-6}h26v12h-22` }, g);
      el("polygon", { points:`${x1+2},${yy+6} ${x1+9},${yy+2} ${x1+9},${yy+10}` }, g);
      el("text", { x:x1+32, y:yy+4 }, g, m.label);
    } else {
      const dir = x2 > x1 ? 1 : -1, xe = x2 - dir*3;
      el("line", { x1, y1:yy, x2:xe - dir*6, y2:yy }, g);
      el("polygon", { points:`${xe},${yy} ${xe-dir*8},${yy-4} ${xe-dir*8},${yy+4}` }, g);
      el("text", { x:(x1+x2)/2, y:yy-6, "text-anchor":"middle" }, g, m.label);
    }
    el("text", { class:"num", x:6, y:yy+4 }, g, String(k+1).padStart(2,"0"));
    return g;
  });
  const scr = carry(M, "screen"), st = carry(M, "state");
  const ticks = {}; M.forEach((m,k) => { if (m.tick) ticks[k] = m.tick; });
  const p = makePlayer($(".tr", demo), { count:M.length, ticks, key, render: k => {
    gs.forEach((g,j) => { g.classList.toggle("on", j===k); g.classList.toggle("past", j<k); g.classList.toggle("future", j>k); });
    const m = M[k], say = $(".say", demo);
    say.setAttribute("style", roleStyle(L[m.from]?.role));
    say.innerHTML = `<span class="stepn">${String(k+1).padStart(2,"0")} · ${esc(L[m.from]?.name)} → ${esc(L[m.to]?.name)}</span>${prose(m.say)}`;
    $(".scr", demo).innerHTML = screenHTML(scr[k], s.screenLabel);
    $(".st", demo).innerHTML = st[k] ? `<div class="screen-label">${esc(s.stateLabel || "The data right now")}</div>${stateHTML(st[k], k ? st[k-1] : null)}` : "";
  } });
  gs.forEach((g,k) => g.addEventListener("click", () => { p.stop(); activePlayer = p; p.go(k); }));
}

/* ═════ trace: real code, one line at a time ═════ */
const KW = /\b(export|import|from|const|let|var|async|await|return|if|else|for|while|function|def|class|new|typeof|null|undefined|true|false|None|True|False|self|this|try|catch|throw|raise|in|of|switch|case|break|continue|fn|pub|impl|struct|match|go|func|defer|interface|type)\b/g;
function hl(line){
  // tiny tokenizer: comments, strings, keywords, function calls. Works well enough for JS/TS/Python/Go/Rust.
  let out = "", i = 0;
  const n = line.length;
  while (i < n) {
    const ch = line[i], rest = line.slice(i);
    if (rest.startsWith("//") || (ch === "#" && /^#(\s|$|!)/.test(rest))) { out += `<span class="tc">${esc(rest)}</span>`; break; }
    if (ch === '"' || ch === "'" || ch === "`") {
      let j = i + 1; while (j < n && line[j] !== ch) { if (line[j] === "\\") j++; j++; }
      out += `<span class="ts">${esc(line.slice(i, j + 1))}</span>`; i = j + 1; continue;
    }
    if (/[A-Za-z_$]/.test(ch)) {
      let j = i; while (j < n && /[\w$]/.test(line[j])) j++;
      const w = line.slice(i, j); KW.lastIndex = 0;
      if (new RegExp("^(" + KW.source.slice(3, -3) + ")$").test(w)) out += `<span class="tk">${w}</span>`;
      else if (/^\s*\(/.test(line.slice(j))) out += `<span class="tf">${w}</span>`;
      else out += esc(w);
      i = j; continue;
    }
    out += esc(ch); i++;
  }
  return out;
}
function renderTrace(s, i){
  const sec = sectionHead(s, i, "Zoom 3 · real code, one line at a time");
  const key = secId(s, i);
  const demo = el("div", { class:"demo" }, sec);
  const F = s.files || {}, FR = s.frames || {}, T = s.steps || [];
  const hasScreen = T.some(t => t.screen != null), hasState = T.some(t => t.state != null);
  demo.innerHTML = `<div class="trace"><div class="codepane"><div class="filetabs"></div><div class="code"></div></div>
    <div class="statepane">
      <div class="blk"><div class="k"><span>Functions running now</span><span>newest on top</span></div><div class="stack"></div></div>
      <div class="blk"><div class="k"><span>Values in this function</span><span>yellow = just changed</span></div><div class="vars"></div></div>
      ${hasScreen ? `<div class="blk"><div class="k"><span>${esc(s.screenLabel || "What you see")}</span></div><div class="scr"></div></div>` : ""}
      ${hasState ? `<div class="blk"><div class="k"><span>${esc(s.stateLabel || "The saved data")}</span><span>yellow = just changed</span></div><div class="st"></div></div>` : ""}
      <div class="blk"><div class="k"><span>Log</span><span>what has happened so far</span></div><div class="log"></div></div>
    </div></div><div class="tr"></div>`;
  const tabs = $(".filetabs", demo), code = $(".code", demo), stack = $(".stack", demo), vars = $(".vars", demo), log = $(".log", demo);
  const scr = carry(T, "screen"), st = carry(T, "state");
  const frameOf = f => typeof f === "string" ? (FR[f] || { name:f }) : f;
  const logsAt = []; let acc = [];
  T.forEach((t,k) => { acc = acc.concat((t.log||[]).map(l => ({ role: l.role, text: l.text, at:k }))); logsAt.push(acc.slice()); });
  const ticks = {}; T.forEach((t,k) => { if (t.tick) ticks[k] = t.tick; });
  const answered = {}; let curFile = null;
  function prevVars(k){ // previous step in the same function, for change highlighting
    const top = JSON.stringify((T[k].stack||[]).slice(-1)), depth = (T[k].stack||[]).length;
    for (let j = k-1; j >= 0; j--) { if ((T[j].stack||[]).length === depth && JSON.stringify((T[j].stack||[]).slice(-1)) === top) return T[j].vars || {}; if ((T[j].stack||[]).length < depth) break; }
    return null;
  }
  function render(k){
    const t = T[k], f = F[t.file]; if (!f) return;
    tabs.innerHTML = Object.entries(F).map(([fk,ff]) => `<span class="filetab${fk===t.file?" on":""}">${esc(ff.path || fk)}</span>`).join("");
    let lines = String(f.code).replace(/\n$/,"").split("\n"); const start = f.start || 1; const last = t.to || t.line;
    if (f.dedent !== false) { const ind = Math.min(...lines.filter(x => x.trim()).map(x => x.match(/^[ \t]*/)[0].length)); if (ind > 0 && isFinite(ind)) lines = lines.map(x => x.slice(Math.min(ind, x.match(/^[ \t]*/)[0].length))); }
    code.innerHTML = ""; let callout = null;
    lines.forEach((ln, j) => {
      const no = start + j, cur = no === t.line, rng = t.to && no > t.line && no <= t.to;
      const d = el("div", { class:`ln${cur?" cur":""}${rng?" rng":""}` }, code);
      d.innerHTML = `<span class="ar">${cur ? "▶" : ""}</span><span class="no">${no}</span><span class="cd">${hl(ln) || " "}</span>`;
      if (no === last) {
        callout = el("div", { class:"callout" }, code); callout.innerHTML = prose(t.say);
        if (t.ask) {
          const a = el("div", { class:"ask" }, callout);
          a.innerHTML = `<b>Guess first: ${prose(t.ask.q)}</b><div class="opts">${t.ask.options.map((o,j2) => `<button data-j="${j2}">${prose(o)}</button>`).join("")}</div><div class="reveal" hidden></div>`;
          const show = j2 => {
            a.querySelectorAll("button").forEach((b,bj) => { b.disabled = true; if (bj===t.ask.answer) b.classList.add("right"); else if (bj===j2) b.classList.add("wrong"); });
            const rv = $(".reveal", a); rv.hidden = false; rv.innerHTML = (j2===t.ask.answer ? "<b>Right.</b> " : "<b>Not quite.</b> ") + prose(t.ask.why);
          };
          a.querySelectorAll("button").forEach(b => b.onclick = () => { answered[k] = +b.dataset.j; show(+b.dataset.j); });
          if (answered[k] != null) show(answered[k]);
        }
      }
    });
    if (callout) { const box = code.getBoundingClientRect(), r = callout.getBoundingClientRect();
      if (r.bottom > box.bottom || r.top < box.top + 60) code.scrollTo({ top: Math.max(0, code.scrollTop + (r.top - box.top) - 140), behavior: curFile===t.file ? "smooth" : "auto" }); }
    curFile = t.file;
    stack.innerHTML = (t.stack||[]).map((fr,j,arr) => { const F2 = frameOf(fr); return `<div class="frame${j===arr.length-1?" top":""}" style="${roleStyle(F2.role)}"><span>${esc(F2.name)}()</span>${F2.about ? `<small>${esc(F2.about)}</small>` : ""}</div>`; }).join("");
    const pv = prevVars(k), V = t.vars || {};
    vars.innerHTML = Object.keys(V).length ? Object.entries(V).map(([n,v]) => {
      const changed = !pv || JSON.stringify(pv[n]) !== JSON.stringify(v);
      return `<span class="vn" data-v="${esc(n)}">${esc(n)}</span><span class="vv${changed?" chg":""}">${prose(String(v))}</span>`;
    }).join("") : `<span class="none">No values yet.</span>`;
    const sc = $(".scr", demo); if (sc) sc.innerHTML = scr[k] ? `<div class="screen">${scr[k]}</div>` : `<span class="none">Nothing to show yet.</span>`;
    const se = $(".st", demo); if (se) se.innerHTML = st[k] ? stateHTML(st[k], k ? st[k-1] : null) : `<span class="none">Nothing yet.</span>`;
    const LG = logsAt[k];
    log.innerHTML = LG.length ? LG.map(l => `<div class="${l.at===k?"new":""}" style="${roleStyle(l.role)}"><span>[${esc(ROLES[l.role]?.name || l.role || "log")}]</span><span>${prose(l.text)}</span></div>`).join("") : `<span class="none">Nothing has happened yet.</span>`;
    log.scrollTop = log.scrollHeight;
  }
  vars.addEventListener("mouseover", e => { const n = e.target.closest(".vn"); if (!n) return; const name = n.dataset.v.split(/[\s.[]/)[0];
    if (name.length > 1) code.querySelectorAll(".ln").forEach(d => d.classList.toggle("dim", !d.textContent.includes(name))); });
  vars.addEventListener("mouseout", () => code.querySelectorAll(".ln.dim").forEach(d => d.classList.remove("dim")));
  makePlayer($(".tr", demo), { count:T.length, ticks, key, render });
}

/* ═════ compare: two ways side by side, stepped together ═════ */
function renderCompare(s, i){
  const sec = sectionHead(s, i, "Side by side");
  const key = secId(s, i);
  const demo = el("div", { class:"demo" }, sec);
  demo.innerHTML = `<div class="cmp"><div class="left"></div><div class="right"></div></div><div class="tr"></div>`;
  const T = s.steps || [];
  const sides = ["left","right"];
  const carried = Object.fromEntries(sides.map(sd => [sd, { screen: carry(T.map(t => t[sd]||{}), "screen"), state: carry(T.map(t => t[sd]||{}), "state") }]));
  const ticks = {}; T.forEach((t,k) => { if (t.tick) ticks[k] = t.tick; });
  makePlayer($(".tr", demo), { count:T.length, ticks, key, render: k => {
    sides.forEach(sd => {
      const meta = s[sd] || {}, step = T[k][sd] || {}, box = $("." + sd, demo);
      box.innerHTML = `<h4 style="color:${rc(meta.role)}">${esc(meta.title || sd)}</h4><div class="say" style="${roleStyle(meta.role)}">${prose(step.say || "")}</div>${screenHTML(carried[sd].screen[k], s.screenLabel)}${carried[sd].state[k] ? stateHTML(carried[sd].state[k], k ? carried[sd].state[k-1] : null) : ""}`;
    });
  } });
}

const R = { glossary:renderGlossary, text:renderText, custom:renderCustom, map:renderMap, flow:renderFlow, trace:renderTrace, compare:renderCompare };
sections.forEach((s, i) => { try { (R[s.type] || renderText)(s, i); } catch (e) { console.error("section failed", s.type, e); } });

if (P.takeaway) { const t = el("div", { class:"takeaway stage" }, app); t.innerHTML = `<div class="eyebrow">The one thing to remember</div><p>${prose(P.takeaway)}</p>`; }
if (P.footer) { const f = el("footer", { class:"stage" }, app); f.innerHTML = prose(P.footer); }

// deep link: #<section-id>-<step>
try { const m = location.hash.match(/^#([\w-]+)-(\d+)$/); if (m && players[m[1]]) { players[m[1]].go(+m[2]-1, false); activePlayer = players[m[1]]; setTimeout(() => document.getElementById(m[1])?.scrollIntoView(), 60); } } catch(e) {}
})();
</script>
